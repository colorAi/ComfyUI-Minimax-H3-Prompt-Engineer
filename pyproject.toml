[project]
name = "minimax-h3-prompt-engineer"
version = "0.4.3"
description = "One-node MiniMax H3 prompt engineering, semantic asset references, validation, and official conditioning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "colorAi" },
]
keywords = [
  "comfyui",
  "minimax-h3",
  "prompt-engineering",
  "video-generation",
  "multimodal",
]
dependencies = [
  "certifi>=2024.2.2",
]
classifiers = [
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/colorAi/ComfyUI-Minimax-H3-Prompt-Engineer"
Documentation = "https://github.com/colorAi/ComfyUI-Minimax-H3-Prompt-Engineer#readme"
"Bug Tracker" = "https://github.com/colorAi/ComfyUI-Minimax-H3-Prompt-Engineer/issues"
Changelog = "https://github.com/colorAi/ComfyUI-Minimax-H3-Prompt-Engineer/blob/main/CHANGELOG.md"

[tool.comfy]
PublisherId = "hootoo"
DisplayName = "MiniMax H3 Prompt Engineer"
requires-comfyui = ">=0.30.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["N999"]
