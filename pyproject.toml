[project]
name = "comfyui-minimax-h3-prompt-engineer"
version = "0.3.0"
description = "Generate validated MiniMax H3 prompts and conditioning through RunningHub, OpenAI, or local LLMs."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "certifi>=2024.2.2",
]

[project.urls]
Repository = "https://github.com/colorAi/ComfyUI-Minimax-H3-Prompt-Engineer"
"Bug Tracker" = "https://github.com/colorAi/ComfyUI-Minimax-H3-Prompt-Engineer/issues"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["N999"]
